<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciar Alunos - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="container" style="padding-bottom: 90px;">
        <h2 style="margin-top: 0; margin-bottom: 16px;"><i class="ph ph-users" style="color: #10b981;"></i> Cadastro de Alunos</h2>
        
        <!-- Formulário para adicionar aluno -->
        <form method="POST">
            <input type="text" name="nome" class="input-field" placeholder="Nome completo do atleta" required autocomplete="off" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #27272a; background: #1c1c1e; color: white; margin-bottom: 12px; box-sizing: border-box; outline: none;">
            <button type="submit" class="btn" style="background: #10b981; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem;">Cadastrar Atleta</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #27272a; margin: 24px 0;">

        <h3>Atletas Cadastrados ({{ alunos|length }})</h3>
        
        {% if alunos %}
            <div style="max-height: 350px; overflow-y: auto;">
                {% for aluno in alunos %}
                <div class="aluno-card" style="background: #1c1c1e; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03);">
                    <span style="font-weight: 500;">{{ aluno.nome_completo }}</span>
                    <a href="{{ url_for('excluir_aluno', id=aluno.id) }}" onclick="return confirm('Deseja realmente excluir este aluno?')" class="btn-delete" style="color: #ef4444; background: rgba(239, 68, 68, 0.1); border: none; padding: 8px 12px; border-radius: 8px; text-decoration: none;">
                        <i class="ph ph-trash" style="font-size: 1.1rem; vertical-align: middle;"></i>
                    </a>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p style="color: #71717a; font-size: 0.9rem;">Nenhum aluno cadastrado no sistema ainda.</p>
        {% endif %}
    </div>

    <!-- MENU INFERIOR -->
    <nav class="bottom-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-item">
            <i class="ph ph-house"></i>
            <span>Início</span>
        </a>
        <a href="{{ url_for('gerenciar_alunos') }}" class="nav-item active">
            <i class="ph-fill ph-users"></i>
            <span>Alunos</span>
        </a>
        <a href="{{ url_for('ranking') }}" class="nav-item">
            <i class="ph ph-trophy"></i>
            <span>Ranking</span>
        </a>
        <a href="{{ url_for('perfil') }}" class="nav-item">
            <i class="ph ph-user"></i>
            <span>Perfil</span>
        </a>
    </nav>

</body>
</html>
