<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .login-card { background: #121214; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 16px; border-radius: 12px; background: #18181b; border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 1rem; outline: none; box-sizing: border-box; }
        input:focus { border-color: #f43f5e; }
        .btn-submit { background: #f43f5e; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: background 0.2s; }
        .btn-submit:hover { background: #e11d48; }
        .erro-msg { background: rgba(225, 29, 72, 0.1); color: #e11d48; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
        .sucesso-msg { background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
        .link-cadastro { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #a1a1aa; }
        .link-cadastro a { color: #f43f5e; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin: 0 0 6px 0; font-size: 1.5rem; text-align: center;">Novo Treinador</h2>
        <p style="margin: 0 0 24px 0; color: #a1a1aa; font-size: 0.9rem; text-align: center;">Crie seu acesso ao painel</p>

        {% if sucesso %}
        <div class="sucesso-msg">{{ sucesso }}</div>
        {% endif %}

        {% if erro %}
        <div class="erro-msg">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label><i class="ph ph-user"></i> Nome Completo</label>
                <input type="text" name="nome" placeholder="Ex: Carlos Silva" required>
            </div>
            <div class="form-group">
                <label><i class="ph ph-envelope"></i> E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label><i class="ph ph-lock"></i> Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label><i class="ph ph-key"></i> Código de Convite</label>
                <input type="text" name="codigo_convite" placeholder="Digite o código de acesso" required>
            </div>
            <button type="submit" class="btn-submit">Criar Conta</button>
        </form>

        <div class="link-cadastro">
            Já tem uma conta? <a href="{{ url_for('login') }}">Fazer Login</a>
        </div>
    </div>
</body>
</html>
