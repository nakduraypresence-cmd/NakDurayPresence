<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configurar Aula - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Padronização da tipografia Inter e eliminação de serifas */
        h1, h2, h3, h4, h5, span, p, strong, a, div, label { font-family: 'Inter', sans-serif !important; }

        body {
            background: #0a0a0a;
            color: #f4f4f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container-form {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 18, 21, 0.95);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* CABEÇALHO */
        .form-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .form-title {
            font-size: 1.15rem;
            margin: 0;
            color: #ffffff;
            font-weight: 800;
            line-height: 1.2;
            flex-grow: 1;
            letter-spacing: -0.02em;
        }

        .form-label {
            display: block;
            color: #a1a1aa;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .option-group { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-bottom: 16px; 
        }

        .radio-btn { 
            cursor: pointer; 
            flex: 1; 
            min-width: 70px; 
            text-align: center; 
        }

        .radio-btn input { 
            display: none; 
        }

        .radio-btn span { 
            display: block; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            background: #121215; 
            color: #a1a1aa;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .radio-btn span:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: #f4f4f5;
        }

        .radio-btn input:checked + span { 
            background: rgba(220, 38, 38, 0.15); 
            color: #fca5a5; 
            border-color: rgba(220, 38, 38, 0.4); 
            font-weight: 700;
        }

        .input-custom {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #121215;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .input-custom:focus {
            border-color: rgba(220, 38, 38, 0.5);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        .btn-salvar { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: none; 
            background: #dc2626; 
            color: #ffffff; 
            font-weight: 800; 
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-salvar:hover {
            background: #ef4444;
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }
    </style>
</head>
<body>

    <div class="container-form">
        <!-- CABEÇALHO -->
        <div class="form-header">
            <a href="/" class="btn-voltar">
                <i class="ph ph-arrow-left" style="font-size: 1rem;"></i> Voltar
            </a>
            <h2 class="form-title">Configurar Nova Aula</h2>
        </div>

        <form action="/criar_aula" method="POST">
            
            <!-- Seleção de Categoria -->
            <span class="form-label">Qual a Categoria?</span>
            <div class="option-group">
                <label class="radio-btn"><input type="radio" name="nome" value="Muay Thai - Feminina" required><span>Feminina</span></label>
                <label class="radio-btn"><input type="radio" name="nome" value="Muay Thai - Masculina"><span>Masculina</span></label>
                <label class="radio-btn"><input type="radio" name="nome" value="Muay Thai - Infantil"><span>Infantil</span></label>
            </div>

            <!-- Seleção de Professor -->
            <span class="form-label">Quem será o Responsável?</span>
            <div class="option-group">
                {% for treinador in treinadores %}
                    <label class="radio-btn">
                        <input type="radio" name="professor" value="{{ treinador.nome }}" {% if loop.first %}required{% endif %}>
                        <span>{{ treinador.nome }}</span>
                    </label>
                {% endfor %}
            </div>

            <!-- Vagas -->
            <span class="form-label">Quantidade de Vagas</span>
            <div class="option-group" style="margin-bottom: 8px;">
                <label class="radio-btn"><input type="radio" name="vagas_atalho" onclick="document.getElementById('vagas').value='10'"><span>10</span></label>
                <label class="radio-btn"><input type="radio" name="vagas_atalho" onclick="document.getElementById('vagas').value='15'"><span>15</span></label>
                <label class="radio-btn"><input type="radio" name="vagas_atalho" onclick="document.getElementById('vagas').value='20'"><span>20</span></label>
            </div>
            <input type="number" id="vagas" name="vagas" class="input-custom" placeholder="Digite ou selecione as vagas..." required min="1">

            <!-- Horário -->
            <span class="form-label">Horário da Aula</span>
            <div class="option-group" style="margin-bottom: 8px;">
                <label class="radio-btn"><input type="radio" name="horario_atalho" onclick="document.getElementById('horario').value='18:00'"><span>18:00</span></label>
                <label class="radio-btn"><input type="radio" name="horario_atalho" onclick="document.getElementById('horario').value='19:00'"><span>19:00</span></label>
                <label class="radio-btn"><input type="radio" name="horario_atalho" onclick="document.getElementById('horario').value='20:00'"><span>20:00</span></label>
            </div>
            <input type="text" id="horario" name="horario" class="input-custom" placeholder="Digite ou selecione o horário..." required>

            <button type="submit" class="btn-salvar">Criar Aula</button>
        </form>
    </div>

</body>
</html>
