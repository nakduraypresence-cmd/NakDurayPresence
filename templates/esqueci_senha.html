<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Nakduray Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Configurações para PWA e Dispositivos Móveis -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* Padronização absoluta da tipografia Inter e exclusão de serifas */
        h1, h2, h3, h4, h5, span, p, strong, a, div, label { font-family: 'Inter', sans-serif !important; }

        :root {
            --bg-dark: #0a0a0a;
            --card-bg: rgba(18, 18, 21, 0.95);
            --input-bg: #121215;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #dc2626;
            --primary-hover: #ef4444;
            --accent-gold: #eab308;
            --success: #10b981;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .login-card { 
            background: var(--card-bg); 
            padding: 40px 32px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
        }

        .header-text { 
            text-align: center; 
            margin-bottom: 32px; 
        }

        .header-text h2 { 
            margin: 0 0 8px 0; 
            font-size: 1.5rem; 
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .header-text p { 
            margin: 0; 
            color: var(--text-muted); 
            font-size: 0.92rem; 
            line-height: 1.5; 
        }
        
        .erro-msg { 
            background: rgba(220, 38, 38, 0.15); 
            color: #fca5a5; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 0.88rem; 
            margin-bottom: 24px; 
            text-align: center; 
            border: 1px solid rgba(220, 38, 38, 0.3); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            font-weight: 600;
        }

        .sucesso-msg { 
            background: rgba(16, 185, 129, 0.15); 
            color: #6ee7b7; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 0.88rem; 
            margin-bottom: 24px; 
            text-align: center; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            font-weight: 600;
        }
        
        .form-group { 
            margin-bottom: 20px; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.82rem; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
        }

        .input-wrapper i { 
            position: absolute; 
            left: 16px; 
            color: var(--text-muted); 
            font-size: 1.2rem; 
            transition: color 0.2s;
        }

        .input-wrapper input { 
            width: 100%; 
            padding: 14px 16px 14px 44px; 
            border-radius: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: white; 
            font-size: 0.95rem; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }

        /* Padronizado com o foco dourado elegante */
        .input-wrapper input:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15); 
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:not(:placeholder-shown) + i {
            color: var(--accent-gold);
        }
        
        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: all 0.2s; 
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:hover { 
            background: var(--primary-hover); 
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }

        .btn-submit:active { 
            transform: scale(0.98); 
        }

        .link-voltar { 
            text-align: center; 
            margin-top: 24px; 
            font-size: 0.9rem; 
        }

        .link-voltar a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            transition: color 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }

        .link-voltar a:hover { 
            color: white; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header-text">
            <h2>Recuperar Senha</h2>
            <p>Digite o e-mail cadastrado e enviaremos um link para você criar uma nova senha.</p>
        </div>

        <!-- EXIBE A MENSAGEM DE ERRO (VERMELHA) -->
        {% if erro %}
        <div class="erro-msg">
            <i class="ph ph-warning-circle" style="font-size: 1.1rem;"></i> {{ erro }}
        </div>
        {% endif %}

        <!-- EXIBE A MENSAGEM DE SUCESSO (VERDE) -->
        {% if sucesso %}
        <div class="sucesso-msg">
            <i class="ph ph-check-circle" style="font-size: 1.1rem;"></i> {{ sucesso }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Seu E-mail</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" name="email" placeholder="seu@email.com" required>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Enviar Link</button>
        </form>

        <div class="link-voltar">
            <a href="{{ url_for('login') }}"><i class="ph ph-arrow-left"></i> Voltar para o Login</a>
        </div>
    </div>
</body>
</html>
