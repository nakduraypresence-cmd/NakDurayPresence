<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recuperar Senha - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Configurações para PWA e Dispositivos Móveis -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --btn-gradient: linear-gradient(135deg, #e11d48, #b91c1c);
            --btn-gradient-hover: linear-gradient(135deg, #f43f5e, #dc2626);
        }

        body { 
            background-color: #08080a;
            background-image: 
                radial-gradient(at 50% 15%, rgba(220, 38, 38, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 85%, rgba(234, 179, 8, 0.08) 0px, transparent 40%);
            color: #f4f4f5; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            -webkit-tap-highlight-color: transparent;
        }

        .login-card { 
            background: rgba(15, 15, 18, 0.9); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 32px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }

        .header-text { 
            text-align: center; 
            margin-bottom: 28px; 
        }

        .header-text h2 { 
            margin: 0 0 6px 0; 
            font-size: 1.55rem; 
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .header-text p { 
            margin: 0; 
            color: #a1a1aa; 
            font-size: 0.875rem; 
            font-weight: 500;
            line-height: 1.5; 
        }
        
        .erro-msg, .sucesso-msg { 
            padding: 12px 14px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
            font-weight: 500;
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .erro-msg { 
            background: rgba(220, 38, 38, 0.12); 
            color: #fca5a5; 
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        .sucesso-msg { 
            background: rgba(16, 185, 129, 0.12); 
            color: #34d399; 
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        
        .form-group { 
            margin-bottom: 20px; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.825rem; 
            color: #d4d4d8; 
            margin-bottom: 8px; 
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
        }

        .input-wrapper i { 
            position: absolute; 
            left: 14px; 
            color: #71717a; 
            font-size: 1.25rem; 
            transition: color 0.2s ease;
            pointer-events: none;
        }

        .input-wrapper input { 
            width: 100%; 
            padding: 13px 16px 13px 44px; 
            border-radius: 12px; 
            background: #121215; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #ffffff; 
            font-size: 0.95rem; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #52525b;
        }

        .input-wrapper input:focus { 
            border-color: #eab308; 
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15); 
            background: #18181b;
        }

        .input-wrapper:focus-within i {
            color: #eab308;
        }
        
        .btn-submit { 
            background: var(--btn-gradient); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 0.95rem; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-submit:hover { 
            background: var(--btn-gradient-hover); 
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
            transform: translateY(-2px);
        }

        .btn-submit:active { 
            transform: translateY(1px); 
        }

        .link-voltar { 
            text-align: center; 
            margin-top: 24px; 
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem; 
        }

        .link-voltar a { 
            color: #a1a1aa; 
            text-decoration: none; 
            font-weight: 700; 
            transition: color 0.2s; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }

        .link-voltar a:hover { 
            color: #eab308; 
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header-text">
            <h2>Recuperar Senha</h2>
            <p>Digite o e-mail cadastrado e enviaremos um link para você criar uma nova senha.</p>
        </div>

        {% if erro %}
        <div class="erro-msg">
            <i class="ph-bold ph-warning-circle" style="font-size: 1.1rem;"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

       {% if sucesso %}
<div class="sucesso-msg" style="word-break: break-all; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 8px;">
    <i class="ph-bold ph-check-circle" style="font-size: 1.1rem; flex-shrink: 0; margin-top: 3px;"></i>
    <span>{{ sucesso }}</span>
</div>
{% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="email">Seu E-mail</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">
                <span>Enviar Link</span>
                <i class="ph-bold ph-paper-plane-tilt"></i>
            </button>
        </form>

        <div class="link-voltar">
            <a href="{{ url_for('login') }}"><i class="ph ph-arrow-left"></i> Voltar para o Login</a>
        </div>
    </div>
</body>
</html>
