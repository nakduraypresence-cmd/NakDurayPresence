<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #121214;
            --input-bg: #18181b;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #f43f5e;
            --primary-hover: #e11d48;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .login-card { 
            background: var(--card-bg); 
            padding: 40px 32px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid var(--border-color); 
            box-sizing: border-box; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .header-text {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .header-text h2 { 
            margin: 0 0 8px 0; 
            font-size: 1.75rem; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .header-text p { 
            margin: 0; 
            color: var(--text-muted); 
            font-size: 0.95rem; 
        }

        .erro-msg { 
            background: rgba(225, 29, 72, 0.1); 
            color: var(--primary-hover); 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 0.9rem; 
            margin-bottom: 24px; 
            text-align: center;
            border: 1px solid rgba(225, 29, 72, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group { 
            margin-bottom: 20px; 
        }
        
        .form-group label { 
            display: block; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .input-wrapper input { 
            width: 100%; 
            padding: 14px 16px 14px 44px; 
            border-radius: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: white; 
            font-size: 1rem; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.2s;
        }
        
        .input-wrapper input:focus { 
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
        }
        
        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .forgot-password a {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: var(--text-main);
        }

        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: background 0.2s, transform 0.1s; 
        }
        
        .btn-submit:hover { 
            background: var(--primary-hover); 
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }

        .link-cadastro { 
            text-align: center; 
            margin-top: 24px; 
            font-size: 0.9rem; 
            color: var(--text-muted); 
        }
        
        .link-cadastro a { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            transition: color 0.2s;
        }
        
        .link-cadastro a:hover {
            color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header-text">
            <h2>Nakduray Presence</h2>
            <p>Área Restrita de Treinadores</p>
        </div>

        {% if erro %}
        <div class="erro-msg">
            <i class="ph ph-warning-circle"></i> {{ erro }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>E-mail</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" name="email" placeholder="seu@email.com" required>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock"></i>
                    <input type="password" name="senha" placeholder="••••••••" required>
                </div>
            </div>
            
            <!-- Link reposicionado e formatado corretamente -->
            <div class="forgot-password">
                <a href="{{ url_for('esqueci_senha') }}">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar no Sistema</button>
        </form>

        <div class="link-cadastro">
            Não tem uma conta? <a href="{{ url_for('cadastro_treinador') }}">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
