<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #08080a;
            background-image: 
                radial-gradient(at 50% 15%, rgba(220, 38, 38, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 85%, rgba(234, 179, 8, 0.08) 0px, transparent 40%);
            color: #f4f4f5; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .login-card { 
            background: rgba(15, 15, 18, 0.9); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 32px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        /* Transforma a imagem quadrada em um escudo redondo com borda dourada */
        .brand-logo {
            width: 105px;
            height: 105px;
            object-fit: cover;
            border-radius: 50%; 
            border: 2px solid rgba(234, 179, 8, 0.6); 
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.35), 0 0 10px rgba(234, 179, 8, 0.2);
            padding: 2px;
            background: #000;
        }

        .brand-header h2 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .brand-header p {
            color: #a1a1aa;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            font-size: 0.825rem; 
            font-weight: 600;
            color: #d4d4d8; 
            margin-bottom: 8px; 
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #71717a;
            font-size: 1.25rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input { 
            width: 100%; 
            padding: 13px 16px 13px 44px; 
            border-radius: 12px; 
            background: #121215; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #ffffff; 
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #52525b;
        }

        input:focus { 
            border-color: #eab308; 
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.15);
            background: #18181b;
        }

        .input-wrapper:focus-within .input-icon {
            color: #eab308;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #71717a;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #eab308;
        }

        .esqueceu-senha { 
            text-align: right; 
            margin-top: -8px; 
            margin-bottom: 22px; 
        }

        .esqueceu-senha a { 
            color: #a1a1aa; 
            text-decoration: none; 
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .esqueceu-senha a:hover { 
            color: #eab308; 
            text-decoration: underline;
        }

        .btn-submit { 
            background: linear-gradient(135deg, #dc2626, #991b1b); 
            color: #ffffff; 
            border: 1px solid rgba(234, 179, 8, 0.3); 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 0.95rem; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 18px rgba(220, 38, 38, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover { 
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #eab308;
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(220, 38, 38, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .erro-msg, .sucesso-msg { 
            padding: 12px 14px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
            font-weight: 500;
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .erro-msg { 
            background: rgba(220, 38, 38, 0.12); 
            color: #fca5a5; 
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        .sucesso-msg { 
            background: rgba(16, 185, 129, 0.12); 
            color: #34d399; 
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .link-cadastro { 
            text-align: center; 
            margin-top: 24px; 
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem; 
            color: #a1a1aa; 
        }

        .link-cadastro a { 
            color: #dc2626; 
            text-decoration: none; 
            font-weight: 700; 
            transition: color 0.2s;
        }

        .link-cadastro a:hover { 
            color: #eab308;
            text-decoration: underline; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo-container">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Nakduray Muay Thai" class="brand-logo">
            </div>
            <h2>Nakduray Presence</h2>
            <p>Área Restrita de Treinadores</p>
        </div>

        {% if sucesso %}
        <div class="sucesso-msg">
            <i class="ph-bold ph-check-circle" style="font-size: 1.1rem;"></i>
            <span>{{ sucesso }}</span>
        </div>
        {% endif %}

        {% if erro %}
        <div class="erro-msg">
            <i class="ph-bold ph-warning-circle" style="font-size: 1.1rem;"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope input-icon"></i>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock input-icon"></i>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()" title="Mostrar/Ocultar senha">
                        <i class="ph ph-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            
            <div class="esqueceu-senha">
                <a href="{{ url_for('esqueci_senha') }}">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">
                <span>Entrar no Sistema</span>
                <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>

        <div class="link-cadastro">
            Não tem uma conta? <a href="{{ url_for('cadastro_treinador') }}">Cadastre-se</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const senhaInput = document.getElementById('senha');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleIcon.className = 'ph ph-eye-slash';
            } else {
                senhaInput.type = 'password';
                toggleIcon.className = 'ph ph-eye';
            }
        }
    </script>
</body>
</html>
