<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Senha - Nakduray Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Padronização absoluta da tipografia Inter e exclusão de serifas */
        h1, h2, h3, h4, h5, span, p, strong, a, div, label { font-family: 'Inter', sans-serif !important; }

        :root {
            --bg-dark: #0a0a0a;
            --card-bg: rgba(18, 18, 21, 0.95);
            --input-bg: #121215;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #dc2626;
            --primary-hover: #ef4444;
            --accent-gold: #eab308;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .auth-title { 
            font-size: 1.5rem; 
            font-weight: 800;
            text-align: center; 
            margin: 0 0 8px 0; 
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .auth-subtitle { 
            color: var(--text-muted); 
            font-size: 0.92rem; 
            text-align: center; 
            margin: 0 0 28px 0; 
            line-height: 1.5;
        }

        .input-group { 
            margin-bottom: 20px; 
        }

        .input-group label { 
            display: block; 
            font-size: 0.82rem; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
        }

        .input-wrapper i { 
            position: absolute; 
            left: 16px; 
            color: var(--text-muted); 
            font-size: 1.2rem; 
            transition: color 0.2s;
        }

        .input-wrapper input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 14px 16px 14px 44px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* Foco com o padrão dourado elegante */
        .input-wrapper input:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15); 
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:not(:placeholder-shown) + i {
            color: var(--accent-gold);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 class="auth-title">Nova Senha</h2>
        <p class="auth-subtitle">Digite a sua nova senha de acesso.</p>
        
        <form method="POST">
            <div class="input-group">
                <label>Nova Senha</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" name="senha" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Salvar Nova Senha</button>
        </form>
    </div>
</body>
</html>
