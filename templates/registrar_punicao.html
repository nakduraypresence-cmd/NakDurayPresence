<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplicar Punição - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { 
            background: #0a0a0a; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            width: 100%;
            max-width: 420px; 
        }
        .voltar { 
            color: #a1a1aa; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 0.9rem; 
            margin-bottom: 16px; 
            transition: color 0.2s;
        }
        .voltar:hover {
            color: white;
        }
        .card-form { 
            background: #121214; 
            border-radius: 20px; 
            padding: 24px; 
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #a1a1aa; 
            margin-bottom: 8px; 
            font-weight: 600; 
        }
        select, input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            background: #1c1c1e; 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            font-size: 1rem; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }
        select:focus, input:focus { 
            border-color: #e11d48; 
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }
        .option-group { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-bottom: 8px; 
        }
        .radio-btn { 
            cursor: pointer; 
            flex: 1; 
            min-width: 70px; 
            text-align: center; 
        }
        .radio-btn input { 
            display: none; 
        }
        .radio-btn span { 
            display: block; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: #1c1c1e; 
            color: #888;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .radio-btn input:checked + span { 
            background: #e11d48; 
            color: white; 
            border-color: #e11d48; 
            font-weight: bold;
        }
        .btn-submit { 
            background: #e11d48; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: background 0.2s; 
            font-size: 1rem; 
        }
        .btn-submit:hover { 
            background: #be123c; 
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('dashboard') }}" class="voltar"><i class="ph ph-arrow-left"></i> Voltar ao Dashboard</a>
        
        <div class="card-form">
            <h2 style="margin: 0 0 4px 0; font-size: 1.2rem;">Aplicar Punição</h2>
            <p style="margin: 0 0 20px 0; color: #a1a1aa; font-size: 0.85rem;">Registre as flexões devidas por indisciplina ou atraso.</p>

            <form method="POST">
                <!-- Seleção de Aluno -->
                <div class="form-group">
                    <label for="aluno_id"><i class="ph ph-user"></i> Selecionar Aluno</label>
                    <select name="aluno_id" id="aluno_id" required>
                        <option value="" disabled selected>Escolha o atleta...</option>
                        {% for aluno in alunos %}
                        <option value="{{ aluno.id }}">{{ aluno.nome_completo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Quantidade de Flexões com Atalhos + Campo Personalizado -->
                <div class="form-group">
                    <label><i class="ph ph-activity"></i> Quantidade de Flexões</label>
                    <div class="option-group">
                        <label class="radio-btn"><input type="radio" name="qtd_atalho" onclick="document.getElementById('quantidade').value='20'"><span>20</span></label>
                        <label class="radio-btn"><input type="radio" name="qtd_atalho" onclick="document.getElementById('quantidade').value='30'"><span>30</span></label>
                        <label class="radio-btn"><input type="radio" name="qtd_atalho" onclick="document.getElementById('quantidade').value='50'"><span>50</span></label>
                    </div>
                    <input type="number" name="quantidade" id="quantidade" placeholder="Ex: 30 ou digite o valor..." required min="1">
                </div>

                <!-- Motivo -->
                <div class="form-group">
                    <label for="motivo"><i class="ph ph-chat-text"></i> Motivo da Punição</label>
                    <input type="text" name="motivo" id="motivo" placeholder="Ex: Atraso, conversa excessiva..." required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="ph ph-check-circle" style="font-size: 1.2rem;"></i> Confirmar Punição
                </button>
            </form>
        </div>
    </div>
</body>
</html>
