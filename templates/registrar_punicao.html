<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplicar Punição - Nakduray Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Padronização absoluta da tipografia Inter e exclusão de serifas */
        h1, h2, h3, h4, h5, span, p, strong, a, div, label { font-family: 'Inter', sans-serif !important; }


        /* Remove o destaque azul de toque em dispositivos móveis e desktops em TUDO */
* {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

/* Remove o contorno azul feio de foco padrão do navegador em botões e inputs */
button:focus, input:focus, select:focus, a:focus, label:focus {
    outline: none !important;
}

/* Impede o travamento por toque prolongado e seleção de texto indesejada em elementos interativos */
button, a, .radio-btn span, input, select {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

        :root {
            --bg-dark: #0a0a0a;
            --card-bg: rgba(18, 18, 21, 0.95);
            --input-bg: #121215;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #dc2626;
            --primary-hover: #ef4444;
            --accent-gold: #eab308;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            width: 100%;
            max-width: 420px; 
            margin: 0 auto;
        }

        .voltar { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .voltar:hover { 
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-form { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 28px 24px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .card-form h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .card-form p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 0 24px 0;
            line-height: 1.4;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        .form-group label { 
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .form-group label i {
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        select, input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: white; 
            font-size: 0.95rem; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }

        select option {
            background: #121215;
            color: white;
        }

        select:focus, input:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15);
        }

        /* Grid organizado em 2 colunas para os atalhos não quebrarem */
        .option-group { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            margin-bottom: 10px; 
        }

        .radio-btn { 
            cursor: pointer; 
            width: 100%;
        }

        .radio-btn input { 
            display: none; 
        }

        .radio-btn span { 
            display: block; 
            text-align: center;
            padding: 10px 8px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .radio-btn input:checked + span { 
            background: rgba(234, 179, 8, 0.15); 
            color: var(--accent-gold); 
            border-color: var(--accent-gold); 
            font-weight: 700;
        }

        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: all 0.2s; 
            font-size: 0.95rem;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:hover { 
            background: var(--primary-hover); 
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('dashboard') }}" class="voltar"><i class="ph ph-arrow-left"></i> Voltar ao Dashboard</a>
        
        <div class="card-form">
            <h2>Aplicar Punição</h2>
            <p>Registre o tipo de punição e a penalidade devida por indisciplina ou atraso.</p>

            <form method="POST">
                <!-- Seleção de Aluno -->
                <div class="form-group">
                    <label for="aluno_id"><i class="ph ph-user"></i> Selecionar Aluno</label>
                    <select name="aluno_id" id="aluno_id" required>
                        <option value="" disabled selected>Escolha o atleta...</option>
                        {% for aluno in alunos %}
                        <option value="{{ aluno.id }}">{{ aluno.nome_completo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Tipo de Punição com Atalhos em Grid + Campo Personalizado -->
                <div class="form-group">
                    <label><i class="ph ph-activity"></i> Tipo de Punição</label>
                    <div class="option-group">
                        <label class="radio-btn"><input type="radio" name="tipo_atalho" onclick="document.getElementById('tipo_punicao').value='Flexões'"><span>Flexões</span></label>
                        <label class="radio-btn"><input type="radio" name="tipo_atalho" onclick="document.getElementById('tipo_punicao').value='Polichinelos'"><span>Polichinelos</span></label>
                        <label class="radio-btn"><input type="radio" name="tipo_atalho" onclick="document.getElementById('tipo_punicao').value='Agachamentos'"><span>Agachamentos</span></label>
                        <label class="radio-btn"><input type="radio" name="tipo_atalho" onclick="document.getElementById('tipo_punicao').value='Burpees'"><span>Burpees</span></label>
                    </div>
                    <input type="text" name="tipo_punicao" id="tipo_punicao" placeholder="Ex: Flexões (30x) ou digite o tipo..." required>
                </div>

                <!-- Motivo -->
                <div class="form-group">
                    <label for="motivo"><i class="ph ph-chat-text"></i> Motivo da Punição</label>
                    <input type="text" name="motivo" id="motivo" placeholder="Ex: Atraso, conversa excessiva..." required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="ph ph-check-circle" style="font-size: 1.2rem;"></i> Confirmar Punição
                </button>
            </form>
        </div>
    </div>
</body>
</html>
