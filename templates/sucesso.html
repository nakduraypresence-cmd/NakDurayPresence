<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presença Confirmada - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; background: #121214; padding: 32px 24px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .success-icon { font-size: 4rem; color: #10b981; margin-bottom: 16px; animation: bounce 0.6s ease; }
        .title { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px 0; color: #fff; }
        .subtitle { color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
        .badge-turma { background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; display: inline-block; margin-bottom: 24px; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>

    <div class="container">
        <i class="ph-fill ph-check-circle success-icon"></i>
        <h1 class="title">Presença Confirmada!</h1>
        <p class="subtitle">Seu check-in foi registrado com sucesso. Prepare o gás e nos vemos no tatame!</p>
        
        <div class="badge-turma">
            <i class="ph ph-shield-check"></i> Vaga Garantida
        </div>

        <p style="color: #71717a; font-size: 0.85rem; margin: 0;">Você já pode fechar esta página com segurança.</p>
    </div>

</body>
</html>
