<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check-in - Nakduray Presence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; background: #121214; padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .input-field { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #27272a; background: #1c1c1e; color: white; font-size: 1rem; margin-bottom: 16px; box-sizing: border-box; outline: none; }
        .input-field:focus { border-color: #10b981; }
        .btn-checkin { background: #10b981; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .btn-checkin:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <i class="ph ph-shield-check" style="font-size: 3rem; color: #10b981; margin-bottom: 12px;"></i>
        <h2 style="margin: 0 0 8px 0; font-size: 1.4rem;">{{ turma.nome }}</h2>
        <p style="color: #a1a1aa; font-size: 0.9rem; margin-bottom: 24px;">
            <i class="ph ph-clock"></i> Horário: {{ turma.horario }} | <i class="ph ph-user"></i> Mestre: {{ turma.professor }}
        </p>

        <form method="POST">
            <select name="aluno_id" class="input-field" required>
                <option value="">Selecione seu nome na lista...</option>
                {% for aluno in alunos %}
                    <option value="{{ aluno.id }}">{{ aluno.nome_completo }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn-checkin">Confirmar Presença</button>
        </form>
        
    </div>

</body>
</html>
