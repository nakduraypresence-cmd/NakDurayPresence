<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turma Encerrada - Nakduray Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Configurações para PWA e Dispositivos Móveis -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body { background: #09090b; color: #f4f4f5; margin: 0; padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .error-card { background: #121214; padding: 32px 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; max-width: 380px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .error-card i { font-size: 3rem; color: #e11d48; margin-bottom: 16px; display: block; }
        h2 { margin: 0 0 8px 0; font-size: 1.3rem; font-weight: 700; color: #f4f4f5; }
        p { color: #a1a1aa; font-size: 0.9rem; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="ph ph-prohibit"></i>
        <h2>Turma não encontrada</h2>
        <p>Esta aula foi encerrada, excluída pelo professor ou o link está incorreto.</p>
    </div>
</body>
</html>
